<style>
        /* Custom Styles for Glow and Animations */
        .gold-border {
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2), inset 0 0 10px rgba(255, 215, 0, 0.1);
        }
        .text-gold-gradient {
            background: linear-gradient(to bottom, #fff6df, #ffd700, #e9c400);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .bg-gold-gradient {
            background: linear-gradient(to bottom, #ffd700, #705d00);
        }
        .shine-effect {
            position: relative;
            overflow: hidden;
        }
        .shine-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            20% { transform: translateX(100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.9)); }
        }
        .pulse-gold {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes spin-anim {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinning {
            animation: spin-anim 1s linear infinite;
        }

        /* Card Animation Styles */
        @keyframes fall-in {
            0% { transform: translateY(-100%); opacity: 0; }
            70% { transform: translateY(10%); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .card-spin-anim {
            animation: fall-in 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        
        .card-premium {
            box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.8);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-premium:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 0 15px rgba(255,215,0,0.2), 0 6px 12px rgba(0,0,0,0.9);
        }
        
        /* Spin Button specific styles */
        .spin-btn-wrapper {
            background: radial-gradient(circle, #ffd700 0%, #705d00 70%, #221b00 100%);

<script>
    function triggerSpin() {
        const grid = document.getElementById('slot-grid');
        const cards = grid.querySelectorAll('.card-premium');
        const fab = document.getElementById('spin-fab');
        const icon = fab.querySelector('.material-symbols-outlined');
        
        // Add rotation animation to FAB icon
        icon.classList.add('spinning');
        fab.classList.remove('pulse-gold'); // temporarily disable pulse
        
        cards.forEach((card, index) => {
            // Remove animation if exists
            card.style.animation = 'none';
            card.offsetHeight; // Trigger reflow
            
            // Add delay based on column/row for a falling effect
            const col = index % 5;
            const row = Math.floor(index / 5);
            const delay = (col * 0.1) + (row * 0.05);
            
            card.style.animation = `fall-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) ${delay}s forwards`;
        });

        // Remove spinning animation after cards finish falling (approx max delay + duration)
        setTimeout(() => {
            icon.classList.remove('spinning');
            fab.classList.add('pulse-gold');
        }, 1200);
    }
</script>
