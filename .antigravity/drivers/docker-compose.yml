version: '3.8'

services:
  pgvector-db:
    image: pgvector/pgvector:pg15
    volumes:
      - locomo_pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  ollama-local:
    image: ollama/ollama
    volumes:
      - locomo_ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  semantic-api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    depends_on:
      - pgvector-db
      - ollama-local
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_URL=http://ollama-local:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
    volumes:
      - ./api:/app
      - ../../:/workspace:rw

volumes:
  locomo_pg_data:
    external: true
  locomo_ollama_data:
    external: true
