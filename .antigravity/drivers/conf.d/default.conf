# Donasi Mandeh Online Virtual Host (PSB Open Donation Platform)
server {
    listen 80;
    server_name donasi.mandeh.online.localhost www.donasi.mandeh.online.localhost donasi.mandeh.online;
    root /var/www/html/donasi.mandeh.online;
    index index.php index.html;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ^~ /data/ {
        deny all;
        return 403;
    }
}

